name: Lua syntax
on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Parse Lua sources
        run: luac5.4 -p nanokontrol_resolve21.lua tests/test_controller.lua
      - name: MIDI behavior simulation
        run: lua5.4 tests/test_controller.lua
      - name: Resolve scripting read-only tests
        run: python3 -m unittest discover -s tests -p 'test_resolve_status.py' -v
