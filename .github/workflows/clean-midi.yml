name: nanoKONTROL Studio Lua tests
on:
  push:
    branches: ["main"]
  pull_request:
    # Stacked research PRs must run CI against their actual target branches.
    branches: ["main", "research/scene2-audio-readonly-probe", "research/scene2-audio-roundtrip-test", "research/scene2-soft-takeover-offline", "research/scene2-midi-one-shot-roundtrip"]

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Syntax
        run: luac5.4 -p nanokontrol_resolve21.lua tests/clean_controller.lua
      - name: Simulated hardware
        run: lua5.4 tests/clean_controller.lua
      - name: Read-only Scene 2 audio probe checks
        run: python3 -m unittest discover -s tests -p 'test_audio_readonly_probe.py'
      - name: Guarded Scene 2 audio round-trip offline tests
        run: python3 -m unittest discover -s tests -p 'test_audio_roundtrip_probe.py'
      - name: Write-free Scene 2 soft takeover tests
        run: python3 -m unittest discover -s tests -p 'test_scene2_soft_takeover.py'
      - name: Passive Scene 2 physical MIDI logger tests
        run: |
          luac5.4 -p scripts/scene2_midi_readonly.lua tests/test_scene2_midi_readonly.lua
          lua5.4 tests/test_scene2_midi_readonly.lua
      - name: Consent-gated one-shot MIDI gain write/restore unit tests
        run: python3 -m unittest discover -s tests -p 'test_scene2_midi_one_shot_roundtrip.py'
      - name: Eight rotary clip volume safety regression tests
        run: python3 -m unittest discover -s tests -p 'test_scene2_clip_gain_8rotary.py'
